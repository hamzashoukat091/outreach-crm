<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Outreach</title>
    <link rel="icon" href="/icon-192.png" />
    <style>
      /* Standalone by necessity: this page is served when the network is
         gone, so it cannot pull the app's stylesheet. Tokens are copied from
         globals.css rather than imported. */
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --accent: #4338ca;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #090b10;
          --surface: #14171f;
          --ink: #e8ecf4;
          --muted: #94a3b8;
          --line: #262b36;
          --accent: #9195fa;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 22rem;
        padding: 2rem 1.5rem;
        border: 1px solid var(--line);
        border-radius: 1rem;
        background: var(--surface);
        text-align: center;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        margin-bottom: 1.25rem;
        border-radius: 0.75rem;
        background: var(--accent);
      }
      .mark img { width: 1.75rem; height: 1.75rem; }
      h1 { margin: 0 0 0.5rem; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 0 0 1.5rem; font-size: 0.875rem; line-height: 1.55; color: var(--muted); }
      button {
        width: 100%;
        min-height: 2.75rem;
        padding: 0 1rem;
        border: 0;
        border-radius: 0.625rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark"><img src="/icon-512.png" alt="" /></span>
      <h1>You're offline</h1>
      <p>
        Outreach needs a connection to load prospects and drafts. Your data is
        safe on the server — nothing was lost.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Reload the moment connectivity returns, so the page doesn't sit here
      // stale while the phone is back on wifi.
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
